<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SWIF Asia — Totem Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Frame tetap 1080x1920, diskalakan ke layar oleh script.js -->
  <div id="fit">
    <!-- MODE 1 · HOME LOOP (8 layar, 15 detik / layar) -->
    <div id="home" class="mode on"><div id="homePages"></div></div>
    <!-- MODE 2 · 3D PRODUCT EXPLORER (pilih produk) -->
    <div id="products" class="mode"></div>
    <!-- MODE 3 · 3D VIEW (detail produk) -->
    <div id="detail" class="mode"></div>
    <!-- header & footer dibuat oleh script.js -->
  </div>

  <!-- Pemuat library: coba folder vendor/ dulu (offline), jika tidak ada pakai CDN.
       Three.js bersifat opsional: tanpa library ini halaman tetap jalan (tanpa viewer 3D). -->
  <script>
  (function () {
    var LIBS = [
      ["vendor/three.min.js",   "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"],
      ["vendor/GLTFLoader.js",  "https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"],
      ["vendor/DRACOLoader.js", "https://unpkg.com/three@0.128.0/examples/js/loaders/DRACOLoader.js"],
      ["vendor/STLLoader.js",   "https://unpkg.com/three@0.128.0/examples/js/loaders/STLLoader.js"],
      ["vendor/OBJLoader.js",   "https://unpkg.com/three@0.128.0/examples/js/loaders/OBJLoader.js"]
    ];
    function load(src) {
      return new Promise(function (ok, fail) {
        var s = document.createElement("script");
        s.src = src; s.onload = ok;
        s.onerror = function () { s.remove(); fail(new Error(src)); };
        document.body.appendChild(s);
      });
    }
    function lib(pair) {
      return load(pair[0]).catch(function () { return load(pair[1]); })
        .catch(function () { console.warn("Library tidak termuat:", pair[0]); });
    }
    var chain = Promise.resolve();
    LIBS.forEach(function (pair, i) {
      chain = chain.then(function () { if (i > 0 && !window.THREE) return; return lib(pair); });
    });
    chain.then(function () { return load("data.js"); })
         .then(function () { return load("script.js"); })
         .catch(function (e) { document.body.insertAdjacentHTML("beforeend", "<pre style='color:#fff;padding:20px'>Gagal memuat: " + e.message + "</pre>"); });
  })();
  </script>
</body>
</html>
